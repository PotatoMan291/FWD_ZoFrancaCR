<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="ZoFranca CR - Gestión académica de solicitudes y cumplimiento para Zona Franca." />
    <title>ZoFranca CR</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>
    <aside class="sidebar" aria-label="Navegación principal">
        <div class="brand">
            <h1>ZoFranca CR</h1>
            <span>Gestión de Zona Franca</span>
        </div>

        <nav class="sidebar-nav">
            <a href="#inicio" class="nav-link" data-view="inicio">
                <span class="material-symbols-outlined" aria-hidden="true">grid_view</span>
                <span>Inicio</span>
            </a>

            <a href="#solicitudes" class="nav-link active" data-view="solicitudes" aria-current="page">
                <span class="material-symbols-outlined filled" aria-hidden="true">description</span>
                <span>Solicitudes</span>
            </a>

            <a href="#cumplimiento" class="nav-link" data-view="cumplimiento">
                <span class="material-symbols-outlined" aria-hidden="true">verified_user</span>
                <span>Cumplimiento</span>
            </a>

            <a href="#alertas" class="nav-link" data-view="alertas">
                <span class="material-symbols-outlined" aria-hidden="true">notifications_active</span>
                <span>Alertas</span>
            </a>

            <a href="#zona" class="nav-link" data-view="zona">
                <span class="material-symbols-outlined" aria-hidden="true">factory</span>
                <span>Zona Franca</span>
            </a>
        </nav>

        <button id="sessionProfile" class="sidebar-profile profile-control" type="button"
            title="Cerrar sesión académica">
            <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
            <span class="sidebar-profile-text">
                <strong data-session-name>María González</strong>
                <small data-session-role>Analista de solicitudes</small>
            </span>
        </button>
    </aside>

    <div class="app">
        <header class="topbar">
            <div id="breadcrumb" class="breadcrumb">Solicitudes</div>

            <div class="topbar-actions">
                <button id="notificationsButton" class="icon-btn" type="button" aria-label="Ver alertas"
                    title="Alertas">
                    <span class="material-symbols-outlined" aria-hidden="true">notifications</span>
                </button>

                <button id="themeToggle" class="icon-btn" type="button" aria-label="Cambiar tema" title="Cambiar tema">
                    <span class="material-symbols-outlined" aria-hidden="true">dark_mode</span>
                </button>

                <button id="helpButton" class="icon-btn" type="button" aria-label="Ayuda" title="Ayuda">
                    <span class="material-symbols-outlined" aria-hidden="true">help_outline</span>
                </button>

                <button id="profileButton" class="avatar profile-control" type="button" aria-label="Perfil académico"
                    title="Cerrar sesión académica">
                    <span class="avatar-initials">MG</span>
                    <span class="sr-only" data-session-name>María González</span>
                </button>
            </div>
        </header>

        <main id="appMain" class="main" tabindex="-1">
            <section class="view-state" role="status">
                <span class="spinner" aria-hidden="true"></span>
                <h2>Cargando ZoFranca CR...</h2>
                <p>Preparando la información de la plataforma.</p>
            </section>
        </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="../js/index.js"></script>
</body>

</html>
